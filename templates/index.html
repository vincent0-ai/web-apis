{% extends "base.html" %}

{% block content %}
    <div class="jumbotron">
        <h1 class="display-4">Welcome!</h1>
        <p class="lead">This is a simple Flask application demonstrating user authentication with MongoDB.</p>
        <hr class="my-4">
        {% if user %}<p>You are logged in as <strong>{{ user.username }}</strong>.</p>{% else %}<p>Please <a href="{{ url_for('login') }}">log in</a> or <a href="{{ url_for('register') }}">register</a> to continue.</p>{% endif %}
    </div>
{% endblock %}
